name: Daily radar

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send only a Telegram test message"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: signal-radar-sheets
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Send Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/send_telegram_alerts.py --test

      - name: Write Google credentials
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          set +x
          test -n "$GOOGLE_CREDENTIALS_JSON"
          test -n "$GOOGLE_SHEETS_ID"
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf 'GOOGLE_SHEETS_ID=%s\n' "$GOOGLE_SHEETS_ID" > .env

      - name: Collect SEC Form 4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_sec_form4
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python3 collectors/collect_sec_form4.py --feed-pages 6 --max-filings 150 --delay 0.05

      - name: Warn when SEC Form 4 is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_sec_form4.outcome == 'failure' }}
        run: |
          echo "::warning::SEC Form 4 collector failed. Skipping raw_sec_form4 load for this run and continuing with existing Google Sheets data."

      - name: Collect USASpending
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_usaspending
        continue-on-error: true
        run: python3 collectors/collect_usaspending.py

      - name: Warn when USASpending is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_usaspending.outcome == 'failure' }}
        run: |
          echo "::warning::USASpending collector failed. Skipping raw_usaspending load for this run and continuing with existing Google Sheets data."

      - name: Collect SAM.gov
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_sam_gov
        continue-on-error: true
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: python3 collectors/collect_sam_gov.py --days 30 --limit 100 --max-pages 2

      - name: Warn when SAM.gov is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_sam_gov.outcome == 'failure' }}
        run: |
          echo "::warning::SAM.gov collector failed. Skipping raw_sam_gov load for this run and continuing with existing Google Sheets data."

      - name: Collect Congress.gov
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_congress_gov
        continue-on-error: true
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python3 collectors/collect_congress_gov.py --use-demo-key --limit 100 --max-pages 2

      - name: Warn when Congress.gov is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_congress_gov.outcome == 'failure' }}
        run: |
          echo "::warning::Congress.gov collector failed. Skipping raw_congress_gov load for this run and continuing with existing Google Sheets data."

      - name: Collect Federal Register
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_federal_register
        continue-on-error: true
        run: python3 collectors/collect_federal_register.py --per-page 100 --max-pages 2

      - name: Warn when Federal Register is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_federal_register.outcome == 'failure' }}
        run: |
          echo "::warning::Federal Register collector failed. Skipping raw_federal_register load for this run and continuing with existing Google Sheets data."

      - name: Collect LDA.gov
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_lda_gov
        continue-on-error: true
        run: python3 collectors/collect_lda_gov.py --page-size 100 --max-pages 2

      - name: Warn when LDA.gov is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_lda_gov.outcome == 'failure' }}
        run: |
          echo "::warning::LDA.gov collector failed. Skipping raw_lda_gov load for this run and continuing with existing Google Sheets data."

      - name: Collect SEC EDGAR additional
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_sec_edgar_additional
        continue-on-error: true
        run: python3 collectors/collect_sec_edgar_additional.py --count 40 --max-pages 1 --delay 0.05

      - name: Warn when SEC EDGAR additional is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_sec_edgar_additional.outcome == 'failure' }}
        run: |
          echo "::warning::SEC EDGAR additional collector failed. Skipping raw_sec_edgar_additional load for this run and continuing with existing Google Sheets data."

      - name: Collect FEC
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_fec
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python3 collectors/collect_fec.py --use-demo-key --per-page 100 --max-pages 2

      - name: Warn when FEC is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_fec.outcome == 'failure' }}
        run: |
          echo "::warning::FEC collector failed. Skipping raw_fec load for this run and continuing with existing Google Sheets data."

      - name: Collect Grants.gov
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        id: collect_grants_gov
        continue-on-error: true
        run: python3 collectors/collect_grants_gov.py --keyword energy --rows 100 --max-pages 2

      - name: Warn when Grants.gov is skipped
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_grants_gov.outcome == 'failure' }}
        run: |
          echo "::warning::Grants.gov collector failed. Skipping raw_grants_gov load for this run and continuing with existing Google Sheets data."

      - name: Send capture summary
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_FORM4_OUTCOME: ${{ steps.collect_sec_form4.outcome }}
          USASPENDING_OUTCOME: ${{ steps.collect_usaspending.outcome }}
          SAM_GOV_OUTCOME: ${{ steps.collect_sam_gov.outcome }}
          CONGRESS_GOV_OUTCOME: ${{ steps.collect_congress_gov.outcome }}
          FEDERAL_REGISTER_OUTCOME: ${{ steps.collect_federal_register.outcome }}
          LDA_GOV_OUTCOME: ${{ steps.collect_lda_gov.outcome }}
          SEC_EDGAR_ADDITIONAL_OUTCOME: ${{ steps.collect_sec_edgar_additional.outcome }}
          FEC_OUTCOME: ${{ steps.collect_fec.outcome }}
          GRANTS_GOV_OUTCOME: ${{ steps.collect_grants_gov.outcome }}
        # Telegram is reserved for congress alerts; the capture summary is logged only.
        run: python3 scripts/send_capture_summary.py --dry-run

      - name: Load SEC Form 4
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_sec_form4.outcome == 'success' }}
        run: python3 loaders/load_sec_form4_csv_to_sheets.py

      - name: Load USASpending
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_usaspending.outcome == 'success' }}
        run: python3 loaders/load_usaspending_csv_to_sheets.py

      - name: Load SAM.gov
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_sam_gov.outcome == 'success' }}
        run: python3 loaders/load_sam_gov_csv_to_sheets.py

      - name: Load Congress.gov
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_congress_gov.outcome == 'success' }}
        run: python3 loaders/load_congress_gov_csv_to_sheets.py

      - name: Load Federal Register
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_federal_register.outcome == 'success' }}
        run: python3 loaders/load_federal_register_csv_to_sheets.py

      - name: Load LDA.gov
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_lda_gov.outcome == 'success' }}
        run: python3 loaders/load_lda_gov_csv_to_sheets.py

      - name: Load SEC EDGAR additional
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_sec_edgar_additional.outcome == 'success' }}
        run: python3 loaders/load_sec_edgar_additional_csv_to_sheets.py

      - name: Load FEC
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_fec.outcome == 'success' }}
        run: python3 loaders/load_fec_csv_to_sheets.py

      - name: Load Grants.gov
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true') && steps.collect_grants_gov.outcome == 'success' }}
        run: python3 loaders/load_grants_gov_csv_to_sheets.py

      - name: Validate raw data quality
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        # Report-only: data quality issues must not block the radar or alerts.
        continue-on-error: true
        run: python3 scripts/validate_raw_quality.py

      - name: Raw data metrics
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        continue-on-error: true
        run: python3 scripts/collect_daily_metrics.py

      - name: Rebuild radar
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        run: python3 scripts/rebuild_radar.py

      - name: Radar metrics
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        continue-on-error: true
        run: python3 scripts/collect_daily_metrics.py

      - name: Send Telegram alerts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Technical radar alerts stay in Google Sheets (review_queue); logged only, not sent.
        run: python3 scripts/send_telegram_alerts.py --dry-run

      - name: Keep scheduled workflows alive
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily_radar.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable congress_watch.yml --repo "$GITHUB_REPOSITORY"
